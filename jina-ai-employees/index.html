*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);

main{max-width:980px;margin:0 auto;padding:4em 1.5em 6em}

.grid{margin-top:2.6em;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.a{position:relative;margin:0;aspect-ratio:1;border-radius:6px;overflow:visible;

.a img{width:100%;height:100%;object-fit:cover;display:block;border-radius:6px;
border:1px solid var(--border);
transition:opacity .25s ease,transform .25s ease,box-shadow .25s ease,border-color .25s}
.grid:hover .a:not(:hover) img{opacity:.45}
.a:hover img{opacity:1 !important;transform:scale(1.14);z-index:3;position:relative;
border-color:var(--accent);box-shadow:0 6px 24px var(--shadow)}
.a figcaption{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px);
background:var(--surface);border:1px dashed var(--border);border-radius:5px;
padding:.45em .7em;white-space:nowrap;pointer-events:none;opacity:0;
transition:opacity .18s ease,transform .18s ease;z-index:10;text-align:center;
box-shadow:0 4px 18px var(--shadow)}
.a:hover figcaption{opacity:1;transform:translate(-50%,0)}
figcaption b{display:block;font-weight:600;font-size:.78em;color:var(--heading)}
figcaption i{display:block;font-style:normal;font-size:.68em;color:var(--text2)}
figcaption span{display:block;font-size:.68em;color:var(--accent)}
@media(max-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}}
